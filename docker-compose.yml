version: '3.8'

services:
  app:
    build: .
    container_name: laravel-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: laravel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: than
      MYSQL_DATABASE: qlns
      MYSQL_USER: root
      MYSQL_PASSWORD: 
    ports:
      - "3307:3306"   
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
